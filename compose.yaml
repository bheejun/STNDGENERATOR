services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: csr
      POSTGRES_USER: ${CSR_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${CSR_DB_PASSWORD:-csr-local}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - csr-postgres-data:/var/lib/postgresql/data

volumes:
  csr-postgres-data:
